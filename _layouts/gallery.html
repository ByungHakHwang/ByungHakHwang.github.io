<!DOCTYPE html>
<html>
  {% include head.html %}

  <body>
    {% include header.html %}

    <div class="page-content">
      <div class="wrapper">
        <div class="gallery">
          {{ content }}

          <div class="gallery-grid">
            {% for item in page.items %}
            <div class="gallery-item">
              <a href="{{ item.src | absolute_url }}">
                <img
                  src="{{ item.src | absolute_url }}"
                  alt="{{ item.alt }}"
                />
              </a>
              {% if item.caption %}
              <p class="gallery-caption">{{ item.caption }}</p>
              {% endif %}
            </div>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>

    {% include footer.html %}

    {% include foot.html %}
  </body>
</html>
